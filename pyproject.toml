[project]
name = "limitiq-credit-line-optimization"
version = "4.1.0"
description = "Educational dynamic credit-line optimization platform"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov-fail-under=65"

[tool.coverage.report]
# Default scoped gate; CI also prints all limitiq files with a nonmatching omit.
omit = ["limitiq/external.py", "limitiq/multisource.py"]
precision = 2

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".deps", ".pytest_cache", ".ruff_cache", "data", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["B008", "E501", "S101"]
