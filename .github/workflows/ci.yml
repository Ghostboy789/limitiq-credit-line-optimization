name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest --cov=limitiq --cov-report=term-missing
      - name: Enforce deployed-model module coverage
        run: python -m coverage report --include='*/behavioral.py' --fail-under=70
      - name: Report all-package coverage
        run: python -m coverage report --omit='__nothing__' --fail-under=0
      - run: python -m limitiq.primary --smoke
      - run: python -m limitiq.sources manifest > /dev/null
      - run: python -m limitiq.analytics --check
      - run: python -m limitiq.sbom --check sbom/limitiq.cdx.json
      - name: Verify v4.2 release manifest
        run: |
          sha256sum -c release/checksums-v4.2.0.sha256
          while read -r sum path; do
            blob=$(git show "HEAD:$path" | sha256sum | cut -d' ' -f1)
            [ "$blob" = "$sum" ] || { echo "STALE: $path (manifest=$sum blob=$blob)"; exit 1; }
          done < release/checksums-v4.2.0.sha256
      - run: bandit -q -r limitiq
      - run: pip-audit -r requirements.txt
      - name: Secret scan
        run: |
          detect-secrets scan --all-files --no-verify --disable-plugin HexHighEntropyString \
            --exclude-files '(^|/)(data/raw|data/processed/clean_source.csv|__pycache__|\.git)(/|$)|\.(png|webp|pdf|joblib|xls)$' . > .secrets.json
          python -c "import json; d=json.load(open('.secrets.json')); assert not any(d['results'].values()), d['results']"
      - run: docker build -t limitiq:test .
      - name: Scan container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: limitiq:test
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - run: docker run -d --name limitiq -p 8000:8000 limitiq:test
      - run: |
          for i in {1..30}; do
            python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)" && exit 0
            sleep 2
          done
          docker logs limitiq
          exit 1
      - name: Enforce per-route Server-Timing under 500 ms
        run: |
          python - <<'PY'
          import re, urllib.request
          routes = ("/", "/portfolio", "/simulator", "/batch", "/governance", "/monitoring", "/v4-lab", "/reports", "/health", "/live", "/ready", "/ops")
          for route in routes:
              with urllib.request.urlopen("http://127.0.0.1:8000" + route, timeout=10) as response:
                  timing = response.headers["Server-Timing"]
              duration = float(re.search(r"dur=([0-9.]+)", timing).group(1))
              assert duration <= 500, (route, timing)
          PY
      - run: python -m limitiq.benchmark http://127.0.0.1:8000/v4-lab --requests 50 --concurrency 5
      - run: python -m limitiq.benchmark http://127.0.0.1:8000/batch --requests 3 --concurrency 2 --timeout 30 --batch-rows 500
      - name: Remove smoke-test container
        if: always()
        run: docker rm -f limitiq || true
